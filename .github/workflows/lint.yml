name: Lint Python code with Ruff & mypy

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
  pull_request:
    paths:
      - "**.py"

permissions:
  contents: read

env:
  VAPOURSYNTH_VERSION: 69
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up VapourSynth ${{ env.VAPOURSYNTH_VERSION }}
        uses: ./.github/actions/setup-vapoursynth
        with:
          vapoursynth-version: ${{ env.VAPOURSYNTH_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: |
          uv run ruff check .
          uv run ruff format --check --diff

      - name: Run mypy
        id: mypy
        continue-on-error: true
        run: uv run mypy .

      - name: Fail if either failed
        if: steps.ruff.outcome == 'failure' || steps.mypy.outcome == 'failure'
        run: exit 1
